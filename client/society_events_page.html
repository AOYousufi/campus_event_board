<!DOCTYPE html>
<head>
    <title>Campus Events Board - Society Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--embed for fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Barrio&family=Modak&family=Protest+Guerrilla&family=Sigmar&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href = "style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!--title-->
    <div style = "text-align: center; align-items: center;margin:2.5%; margin-bottom: 1.5%;">
    <a class = "title" href="landing_page.html" alt = "Campus Events">Campus Events</a>
    </div>

    <!--links bar-->
    <section class = "links_bar">
        <div style = "margin-bottom: -0.05%;display: flex;">
            <ul>
                <li><a href = "all_events_page.html" alt = "All Events">All Events</a></li>
                <li class = "active"><a href="society_events_page.html" alt="Society Events">Society Events</a></li>
                <li><a href = "test.html">SU Events</a></li>
                <li><a href="test.html">University Events</a></li>
            </ul>
        </div>
    </section>

    <h3 style = "font-size: 350%;margin-top:2%;margin-left:5%">Society Events</h3>

    <div style = "float:inline-end;margin-right:4%; margin-top:-2.5%;">
        <!--Filters-->
        <button onclick="displayMenu('categories')" class = "filter_button" style = "float:inline-start; margin-left:-6%"><img class = "icon" src = "images/filter2.png"><p>Filters</p></button>
        <div id="categories" class = "categories_list">
            <button onclick="displayMenu('societies')">Society</button>
            <button onclick="displayMenu('locations')">Location</button>
            <button onclick="displaySocieties()">Date/Time</button>
            <button onclick="clearAllFilters()" href="#">Clear All Filters</button>
        </div>
        <div id="societies" class = "filters_list">
            <button onclick="displayMenu('societies')" href="#">&larr; Back</button>
            <button href="#">Society 1</button>
            <button href="#">Society 2</button>
            <button href="#">Society 3</button>
        </div>
        <div id="locations" class = "filters_list">
            <button onclick="displayMenu('locations')" href="#">&larr; Back</button>
            <button onclick="updateLocationFilter('stoke')" href="#">Stoke-on-Trent</button>
            <button onclick="updateLocationFilter('london')" href="#">London</button>
            <button onclick="updateLocationFilter('stafford')" href="#">Stafford</button>
        </div>

        <!--search bar-->
        <div style = "float:inline-end;margin-top:0.8%">
            <form>
                <label for="search">Search Events: </label>
                <input type="text" id="search" name="search">
                <input type="button" id="search_button" name= "search_button" value="Search">
            </form>
        </div>
    </div>
</body>
